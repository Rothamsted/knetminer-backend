datasetId = legumes-premium
datasetAccession = KnetMiner:Legumes
datasetTitle = Knetminer's knowledge graph about legumes
datasetDescription = \
  Knetminer is a gene discovery platform, which allows for exploring knowledge graphs computed \
  from common plant biology data, such as ENSEMBL, UniProt, TAIR, PUBMED and more.\n\
	The legumes dataset contains information about 7 legume species, which is also linked \
	to embedded data about the Arabidopsis thaliana model organism.\n\
	This edition includes Arachis hypogaea, Cicer arietinum, Glycine max, Medicago truncatula, Phaseolus vulgaris, Pisum sativum, Vicia faba.
datasetVersion = 63
