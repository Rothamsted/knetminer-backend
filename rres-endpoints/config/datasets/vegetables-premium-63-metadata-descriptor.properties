datasetId = vegetables-premium
datasetAccession = KnetMiner:Vegetables-premium
datasetTitle = Knetminer's knowledge graph about Vegetables
datasetDescription = \
  Knetminer is a gene discovery platform, which allows for exploring knowledge graphs computed \
  from common plant biology data, such as ENSEMBL, UniProt, TAIR, PUBMED and more.\n\
	This edition covers ten vegetable crops linked to embedded data about the Arabidopsis model \
	organism.\n\
	Included species: Arabidopsis thaliana, Asparagus officinalis, Beta vulgaris, Capsicum annuum, \
	Cucumis melo, Cucumis sativus, Daucus carota, Lactuca sativa, Nicotiana attenuata, \
	Solanum lycopersicum, Solanum tuberosum.
datasetVersion = 63
